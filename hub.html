<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jordan's Hobby Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        header {
            text-align: center;
            margin-bottom: 50px;
            color: white;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        .project-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }

        .project-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }

        .project-icon {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 64px;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8ec 100%);
        }

        .project-card:nth-child(1) .project-icon {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .project-card:nth-child(2) .project-icon {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .project-card:nth-child(3) .project-icon {
            background: linear-gradient(135deg, #d299c2 0%, #fef9d7 100%);
        }

        .project-content {
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .project-title {
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .project-description {
            font-size: 0.95rem;
            color: #666;
            line-height: 1.6;
            flex: 1;
            margin-bottom: 16px;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            color: #667eea;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .project-link svg {
            margin-left: 6px;
            transition: transform 0.2s ease;
        }

        .project-card:hover .project-link svg {
            transform: translateX(4px);
        }

        footer {
            text-align: center;
            margin-top: 60px;
            color: rgba(255,255,255,0.8);
            font-size: 0.9rem;
        }

        @media (max-width: 640px) {
            header h1 {
                font-size: 1.8rem;
            }

            .container {
                padding: 24px 16px;
            }

            .projects-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Jordan's Hobby Projects</h1>
            <p>A collection of fun experiments and side projects</p>
        </header>

        <main class="projects-grid" id="projectsGrid">
            <!-- Projects will be loaded dynamically from config -->
        </main>

        <footer>
            <p>Made with curiosity and creativity</p>
        </footer>
    </div>

    <script src="projects-config.js"></script>
    <script>
        // Render projects from config
        const grid = document.getElementById('projectsGrid');

        PROJECTS_CONFIG.projects.forEach(project => {
            const card = document.createElement('a');
            card.href = project.url;
            card.className = 'project-card';
            card.innerHTML = `
                <div class="project-icon">${project.icon}</div>
                <div class="project-content">
                    <h2 class="project-title">${project.name}</h2>
                    <p class="project-description">${project.description}</p>
                    <span class="project-link">
                        Open Project
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M5 12h14M12 5l7 7-7 7"/>
                        </svg>
                    </span>
                </div>
            `;
            grid.appendChild(card);
        });
    </script>
</body>
</html>
