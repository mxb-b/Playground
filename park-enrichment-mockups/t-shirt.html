<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Park Enrichment - T-Shirt Mockup</title>
  <link rel="stylesheet" href="styles/common.css">
  <style>
    .mockup-container {
      background: linear-gradient(145deg, #f5f5f0 0%, #e8e8e0 100%);
      min-height: 100vh;
      padding: 40px;
    }

    .mockup-title {
      color: rgba(0, 0, 0, 0.4);
      margin-bottom: 40px;
    }

    .tshirts-wrapper {
      display: flex;
      gap: 80px;
      justify-content: center;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .tshirt-column {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .tshirt-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(0, 0, 0, 0.4);
      margin-bottom: 20px;
      text-align: center;
    }

    /* T-Shirt Base Shape */
    .tshirt-mockup {
      position: relative;
      width: 320px;
      height: 400px;
      filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.15));
    }

    .tshirt-shape {
      width: 100%;
      height: 100%;
    }

    /* T-shirt SVG styling */
    .tshirt-body {
      transition: fill 0.3s ease;
    }

    /* Logo placement on shirt */
    .tshirt-logo {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -60%);
      width: 180px;
    }

    .tshirt-logo.icon-only {
      width: 100px;
    }

    .tshirt-logo.small {
      width: 80px;
      top: 30%;
      left: 35%;
    }

    .tshirt-logo.back-large {
      width: 220px;
      top: 55%;
    }

    /* Color variants container */
    .color-variants {
      display: flex;
      gap: 40px;
      margin-top: 60px;
      padding-top: 40px;
      border-top: 1px solid rgba(0, 0, 0, 0.1);
    }

    .variant-item {
      text-align: center;
    }

    .variant-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: rgba(0, 0, 0, 0.5);
      margin-bottom: 10px;
    }

    .variant-preview {
      width: 100px;
      height: 120px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.1));
    }

    /* Tag line section */
    .tagline-on-shirt {
      position: absolute;
      bottom: 25%;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-primary);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    .tagline-dark {
      color: #2d3a36;
    }

    .tagline-light {
      color: rgba(255, 255, 255, 0.9);
    }
  </style>
</head>
<body>
  <div class="mockup-container">
    <p class="mockup-title">T-Shirt Mockups</p>

    <div class="tshirts-wrapper">
      <!-- White T-Shirt - Front -->
      <div class="tshirt-column">
        <p class="tshirt-label">White - Front</p>
        <div class="tshirt-mockup">
          <svg class="tshirt-shape" viewBox="0 0 320 400">
            <!-- T-shirt shape -->
            <path class="tshirt-body" d="
              M 80 0
              L 0 60
              L 30 80
              L 50 70
              L 50 380
              Q 50 400 70 400
              L 250 400
              Q 270 400 270 380
              L 270 70
              L 290 80
              L 320 60
              L 240 0
              Q 220 30 160 30
              Q 100 30 80 0
              Z
            " fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
            <!-- Collar -->
            <ellipse cx="160" cy="15" rx="35" ry="15" fill="#f0f0f0"/>
            <!-- Sleeve shadows -->
            <path d="M 50 70 Q 25 75 30 80" fill="none" stroke="#e8e8e8" stroke-width="8"/>
            <path d="M 270 70 Q 295 75 290 80" fill="none" stroke="#e8e8e8" stroke-width="8"/>
          </svg>
          <!-- Full Logo -->
          <img class="tshirt-logo" src="assets/2026.Enrichment.logo_multigreen_HORIZ.png" alt="Park Enrichment">
          <span class="tagline-on-shirt tagline-dark">The Park School Enrichment</span>
        </div>
      </div>

      <!-- Forest Green T-Shirt - Front -->
      <div class="tshirt-column">
        <p class="tshirt-label">Forest Green - Front</p>
        <div class="tshirt-mockup">
          <svg class="tshirt-shape" viewBox="0 0 320 400">
            <path class="tshirt-body" d="
              M 80 0
              L 0 60
              L 30 80
              L 50 70
              L 50 380
              Q 50 400 70 400
              L 250 400
              Q 270 400 270 380
              L 270 70
              L 290 80
              L 320 60
              L 240 0
              Q 220 30 160 30
              Q 100 30 80 0
              Z
            " fill="#3d7a6d" stroke="#2d5a50" stroke-width="1"/>
            <ellipse cx="160" cy="15" rx="35" ry="15" fill="#346b60"/>
            <path d="M 50 70 Q 25 75 30 80" fill="none" stroke="#2d5a50" stroke-width="8"/>
            <path d="M 270 70 Q 295 75 290 80" fill="none" stroke="#2d5a50" stroke-width="8"/>
          </svg>
          <!-- Icon only logo - white -->
          <img class="tshirt-logo icon-only" src="assets/2026.Enrichment.logo_multigreen_SQUARE.png" alt="Park Enrichment">
          <span class="tagline-on-shirt tagline-light">The Park School Enrichment</span>
        </div>
      </div>

      <!-- Navy T-Shirt - Back -->
      <div class="tshirt-column">
        <p class="tshirt-label">Navy - Back</p>
        <div class="tshirt-mockup">
          <svg class="tshirt-shape" viewBox="0 0 320 400">
            <path class="tshirt-body" d="
              M 80 0
              L 0 60
              L 30 80
              L 50 70
              L 50 380
              Q 50 400 70 400
              L 250 400
              Q 270 400 270 380
              L 270 70
              L 290 80
              L 320 60
              L 240 0
              Q 220 30 160 30
              Q 100 30 80 0
              Z
            " fill="#1a2634" stroke="#0f1a24" stroke-width="1"/>
            <ellipse cx="160" cy="15" rx="35" ry="15" fill="#152230"/>
            <path d="M 50 70 Q 25 75 30 80" fill="none" stroke="#0f1a24" stroke-width="8"/>
            <path d="M 270 70 Q 295 75 290 80" fill="none" stroke="#0f1a24" stroke-width="8"/>
          </svg>
          <!-- Large back logo -->
          <img class="tshirt-logo back-large" src="assets/2026.Enrichment.logo_multigreen.png" alt="Park Enrichment">
        </div>
      </div>
    </div>

    <!-- Color Variants -->
    <div style="max-width: 1200px; margin: 60px auto 0; padding-top: 40px; border-top: 1px solid rgba(0,0,0,0.1);">
      <p class="tshirt-label" style="text-align: center; margin-bottom: 30px;">Available Colors</p>
      <div style="display: flex; justify-content: center; gap: 30px; flex-wrap: wrap;">

        <!-- White variant -->
        <div class="variant-item">
          <p class="variant-label">White</p>
          <svg class="variant-preview" viewBox="0 0 100 120">
            <path d="M 25 0 L 0 18 L 9 25 L 15 22 L 15 115 Q 15 120 22 120 L 78 120 Q 85 120 85 115 L 85 22 L 91 25 L 100 18 L 75 0 Q 68 10 50 10 Q 32 10 25 0 Z" fill="#ffffff" stroke="#e0e0e0" stroke-width="0.5"/>
            <ellipse cx="50" cy="5" rx="11" ry="5" fill="#f0f0f0"/>
          </svg>
        </div>

        <!-- Forest Green variant -->
        <div class="variant-item">
          <p class="variant-label">Forest</p>
          <svg class="variant-preview" viewBox="0 0 100 120">
            <path d="M 25 0 L 0 18 L 9 25 L 15 22 L 15 115 Q 15 120 22 120 L 78 120 Q 85 120 85 115 L 85 22 L 91 25 L 100 18 L 75 0 Q 68 10 50 10 Q 32 10 25 0 Z" fill="#3d7a6d" stroke="#2d5a50" stroke-width="0.5"/>
            <ellipse cx="50" cy="5" rx="11" ry="5" fill="#346b60"/>
          </svg>
        </div>

        <!-- Navy variant -->
        <div class="variant-item">
          <p class="variant-label">Navy</p>
          <svg class="variant-preview" viewBox="0 0 100 120">
            <path d="M 25 0 L 0 18 L 9 25 L 15 22 L 15 115 Q 15 120 22 120 L 78 120 Q 85 120 85 115 L 85 22 L 91 25 L 100 18 L 75 0 Q 68 10 50 10 Q 32 10 25 0 Z" fill="#1a2634" stroke="#0f1a24" stroke-width="0.5"/>
            <ellipse cx="50" cy="5" rx="11" ry="5" fill="#152230"/>
          </svg>
        </div>

        <!-- Black variant -->
        <div class="variant-item">
          <p class="variant-label">Black</p>
          <svg class="variant-preview" viewBox="0 0 100 120">
            <path d="M 25 0 L 0 18 L 9 25 L 15 22 L 15 115 Q 15 120 22 120 L 78 120 Q 85 120 85 115 L 85 22 L 91 25 L 100 18 L 75 0 Q 68 10 50 10 Q 32 10 25 0 Z" fill="#1a1a1a" stroke="#000000" stroke-width="0.5"/>
            <ellipse cx="50" cy="5" rx="11" ry="5" fill="#111111"/>
          </svg>
        </div>

        <!-- Heather Gray variant -->
        <div class="variant-item">
          <p class="variant-label">Heather</p>
          <svg class="variant-preview" viewBox="0 0 100 120">
            <path d="M 25 0 L 0 18 L 9 25 L 15 22 L 15 115 Q 15 120 22 120 L 78 120 Q 85 120 85 115 L 85 22 L 91 25 L 100 18 L 75 0 Q 68 10 50 10 Q 32 10 25 0 Z" fill="#9ca3a3" stroke="#8a9090" stroke-width="0.5"/>
            <ellipse cx="50" cy="5" rx="11" ry="5" fill="#8a9090"/>
          </svg>
        </div>

        <!-- Sage variant -->
        <div class="variant-item">
          <p class="variant-label">Sage</p>
          <svg class="variant-preview" viewBox="0 0 100 120">
            <path d="M 25 0 L 0 18 L 9 25 L 15 22 L 15 115 Q 15 120 22 120 L 78 120 Q 85 120 85 115 L 85 22 L 91 25 L 100 18 L 75 0 Q 68 10 50 10 Q 32 10 25 0 Z" fill="#9caf88" stroke="#8a9d78" stroke-width="0.5"/>
            <ellipse cx="50" cy="5" rx="11" ry="5" fill="#8a9d78"/>
          </svg>
        </div>

      </div>
    </div>
  </div>

  <!-- Projects Menu -->
  <script src="../projects-config.js"></script>
  <script src="../projects-menu.js"></script>
</body>
</html>
