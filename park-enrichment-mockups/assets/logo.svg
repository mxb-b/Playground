<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" width="520" height="140">
  <!-- Park Enrichment Logo -->

  <!-- Color palette -->
  <!-- Dark teal: #3d7a6d -->
  <!-- Medium green/teal: #2e9e7f / #319b7a -->
  <!-- Light green: #5bb89a / #6bc4a6 -->

  <!-- Leaf block -->
  <rect x="0" y="0" width="80" height="80" rx="10" ry="10" fill="#4a8f7f"/>
  <g transform="translate(15, 25)">
    <path d="M5 35 Q8 20 25 15 Q35 12 48 18 Q52 8 55 5"
          stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M25 15 Q30 28 25 40"
          stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- P block -->
  <rect x="90" y="0" width="80" height="80" rx="10" ry="10" fill="#2e9e7f"/>
  <ellipse cx="140" cy="30" rx="22" ry="20" fill="white"/>

  <!-- A block -->
  <rect x="180" y="0" width="80" height="80" rx="10" ry="10" fill="#3d7a6d"/>
  <polygon points="220,8 180,80 260,80" fill="#2e9e7f"/>

  <!-- R block -->
  <rect x="270" y="0" width="80" height="80" rx="10" ry="10" fill="#3d7a6d"/>
  <ellipse cx="325" cy="50" rx="28" ry="24" fill="#5bb89a"/>

  <!-- K block -->
  <rect x="360" y="0" width="80" height="80" rx="10" ry="10" fill="#4a8f7f"/>
  <polygon points="395,0 440,0 440,45" fill="#6bc4a6"/>
  <polygon points="395,80 440,80 440,35" fill="#5bb89a"/>

  <!-- ENRICHMENT text -->
  <text x="5" y="120" font-family="'Didact Gothic', 'Century Gothic', Arial, sans-serif"
        font-size="32" font-weight="400" letter-spacing="6" fill="#2e9e7f">
    ENRICHMENT
  </text>
</svg>
