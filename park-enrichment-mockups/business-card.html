<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Park Enrichment - Business Card Mockup</title>
  <link rel="stylesheet" href="styles/common.css">
  <link href="https://fonts.googleapis.com/css2?family=Didact+Gothic&display=swap" rel="stylesheet">
  <style>
    .mockup-container {
      background: linear-gradient(145deg, #2d3a36 0%, #1a2421 100%);
      min-height: 100vh;
      perspective: 1000px;
    }

    .mockup-title {
      color: rgba(255, 255, 255, 0.5);
    }

    .cards-wrapper {
      display: flex;
      gap: 60px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: center;
    }

    .card-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.4);
      margin-bottom: 15px;
      text-align: center;
    }

    /* Business Card - Standard US size 3.5" x 2" (350px x 200px at 100dpi) */
    .business-card {
      width: 350px;
      height: 200px;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      transition: transform 0.4s ease;
    }

    .business-card:hover {
      transform: translateY(-5px);
    }

    /* Front of card */
    .card-front {
      background: linear-gradient(135deg, var(--pe-white) 0%, var(--pe-off-white) 100%);
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      padding: 25px 30px;
    }

    .card-front .logo-area {
      flex: 1;
      display: flex;
      align-items: flex-start;
    }

    .card-front .logo-area svg {
      height: 55px;
      width: auto;
    }

    .card-front .contact-info {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .card-front .person-info h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--pe-dark-teal);
      margin-bottom: 2px;
    }

    .card-front .person-info p {
      font-size: 10px;
      color: var(--pe-medium-green);
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .card-front .contact-details {
      text-align: right;
      font-size: 9px;
      color: var(--pe-dark-gray);
      line-height: 1.8;
    }

    /* Back of card */
    .card-back {
      background: linear-gradient(135deg, var(--pe-dark-teal) 0%, var(--pe-accent-teal) 100%);
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .card-back::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 200px;
      height: 200px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50%;
    }

    .card-back::after {
      content: '';
      position: absolute;
      bottom: -40%;
      left: -20%;
      width: 150px;
      height: 150px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 50%;
    }

    .card-back .icon-logo {
      width: 60px;
      height: 60px;
      margin-bottom: 15px;
    }

    .card-back .tagline {
      font-size: 11px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    /* Decorative elements */
    .accent-line {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--pe-medium-green), var(--pe-light-green));
    }
  </style>
</head>
<body>
  <div class="mockup-container">
    <p class="mockup-title">Business Card Mockup</p>

    <div class="cards-wrapper">
      <!-- Front of card -->
      <div>
        <p class="card-label">Front</p>
        <div class="business-card card-front">
          <div class="logo-area">
            <!-- Inline SVG Logo -->
            <svg viewBox="0 0 520 140" height="55">
              <rect x="0" y="0" width="80" height="80" rx="10" ry="10" fill="#4a8f7f"/>
              <g transform="translate(15, 25)">
                <path d="M5 35 Q8 20 25 15 Q35 12 48 18 Q52 8 55 5" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M25 15 Q30 28 25 40" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
              </g>
              <rect x="90" y="0" width="80" height="80" rx="10" ry="10" fill="#2e9e7f"/>
              <ellipse cx="140" cy="30" rx="22" ry="20" fill="white"/>
              <rect x="180" y="0" width="80" height="80" rx="10" ry="10" fill="#3d7a6d"/>
              <polygon points="220,8 180,80 260,80" fill="#2e9e7f"/>
              <rect x="270" y="0" width="80" height="80" rx="10" ry="10" fill="#3d7a6d"/>
              <ellipse cx="325" cy="50" rx="28" ry="24" fill="#5bb89a"/>
              <rect x="360" y="0" width="80" height="80" rx="10" ry="10" fill="#4a8f7f"/>
              <polygon points="395,0 440,0 440,45" fill="#6bc4a6"/>
              <polygon points="395,80 440,80 440,35" fill="#5bb89a"/>
              <text x="5" y="120" font-family="'Didact Gothic', 'Century Gothic', Arial, sans-serif" font-size="32" font-weight="400" letter-spacing="6" fill="#2e9e7f">ENRICHMENT</text>
            </svg>
          </div>
          <div class="contact-info">
            <div class="person-info">
              <h3>Sarah Mitchell</h3>
              <p>Program Director</p>
            </div>
            <div class="contact-details">
              <div>sarah@parkenrichment.org</div>
              <div>(555) 123-4567</div>
              <div>www.parkenrichment.org</div>
            </div>
          </div>
          <div class="accent-line"></div>
        </div>
      </div>

      <!-- Back of card -->
      <div>
        <p class="card-label">Back</p>
        <div class="business-card card-back">
          <!-- Icon only version of logo -->
          <svg class="icon-logo" viewBox="0 0 80 80">
            <rect x="0" y="0" width="80" height="80" rx="10" ry="10" fill="rgba(255,255,255,0.15)"/>
            <g transform="translate(15, 25)">
              <path d="M5 35 Q8 20 25 15 Q35 12 48 18 Q52 8 55 5" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M25 15 Q30 28 25 40" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>
            </g>
          </svg>
          <p class="tagline">Grow • Learn • Thrive</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
